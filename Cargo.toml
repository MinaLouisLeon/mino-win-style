[workspace]
resolver = "2"
members = [
    "crates/mino-core",
    "crates/mino-win",
    "crates/mino-shell",
    "crates/mino-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Mina Louis"]

[workspace.dependencies]
mino-core = { path = "crates/mino-core" }
mino-win = { path = "crates/mino-win" }
mino-shell = { path = "crates/mino-shell" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Pinned deliberately: every Win32 call in `mino-win` is written against this
# version's signatures. Bumping it is a reviewed change, not a routine update.
windows = "0.58"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
