[package]
name = "mino-cli"
description = "Headless apply, revert and safe-restore for mino-win-style."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mino"
path = "src/main.rs"

[dependencies]
mino-core = { workspace = true }
mino-win = { workspace = true }
# `color` is off deliberately: it pulls anstream -> windows-sys, and a recovery
# tool whose output gets piped into a log is better off plain anyway.
clap = { version = "4", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
serde_json = { workspace = true }
