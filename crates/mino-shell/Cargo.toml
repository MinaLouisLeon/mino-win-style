[package]
name = "mino-shell"
description = "Our own shell surfaces: what is running, what it looks like, and how to bring it forward."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # The four below are the HUD's telemetry, and nothing else uses them:
    # network counters, disk free space, battery, and memory + uptime.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # Task View, opened from the Yaru bar by saying Win+Tab through SendInput.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
