[package]
name = "mino-cli"
description = "Headless apply, revert and safe-restore for mino-win-style."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mino"
path = "src/main.rs"

[dependencies]
mino-core = { workspace = true }
mino-win = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
